name: Create Release

on:
  push:
    tags:
      - 'debian/*'

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - env:
          FULL_NAME: ${{ github.repository }}
          FULL_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${FULL_NAME#*/}"
          VERS="${FULL_TAG#debian/}"
          VERS="${VERS#*[0-9]%}"

          gh release create "$FULL_TAG" --title "$NAME $VERS" --generate-notes

  build_wheel:
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - run: |
          python3 -m pip install --upgrade pip
          pip install build
          python3 -m build

      - env:
          FULL_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$FULL_TAG" dist/*
